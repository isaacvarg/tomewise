<h1>Exam · the first five letters</h1>
<p>Five letters, all new questions.</p>
<tome-exam-question id="q1" tests="item:letter-s item:letter-u">
  <p>Which letter is S with its last dit changed to a dah?</p>
  <tome-choice answer="U"><option>U</option><option>R</option><option>K</option></tome-choice>
</tome-exam-question>
<tome-exam-question id="q2" tests="item:letter-m">
  <p>Which letter has only two sounds, both long?</p>
  <tome-choice answer="M"><option>S</option><option>M</option><option>U</option></tome-choice>
</tome-exam-question>
<tome-exam-question id="q3" tests="item:letter-r item:letter-s">
  <p>Which letter has as many sounds as S but a dah in the middle?</p>
  <tome-choice answer="R"><option>K</option><option>U</option><option>R</option></tome-choice>
</tome-exam-question>
<tome-exam-question id="q4" tests="item:letter-k item:letter-u">
  <p>Type the word these letters spell: dit-dit-dah, then dah-di-dah.</p>
  <tome-typed answer="UK"><option>uk</option></tome-typed>
</tome-exam-question>
<tome-done></tome-done>
</body>
